<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UE5 Learning Path Viewer</title>
  <meta name="description" content="Interactive learner viewer for UE5 Learning Path courses">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- Load course data from localStorage if available, otherwise fall back to data.js -->
  <script>
    (function() {
      var stored = localStorage.getItem('v3_viewer_course_data');
      if (stored) {
        try {
          window.COURSE_LIBRARY = JSON.parse(stored);
          // Update page title with course name
          if (window.COURSE_LIBRARY[0] && window.COURSE_LIBRARY[0].title) {
            document.title = window.COURSE_LIBRARY[0].title + ' — UE5 Learning Path Viewer';
          }
        } catch(e) {
          console.warn('[Viewer] Failed to parse localStorage data, falling back to data.js');
        }
      }
    })();
  </script>
  <script src="data.js" onerror="console.log('[Viewer] No data.js found, using localStorage data')"></script>
  <script src="app.js"></script>
</body>
</html>
