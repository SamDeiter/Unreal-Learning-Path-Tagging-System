name: URL Health Check

on:
  schedule:
    # Every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: # Manual trigger

jobs:
  check-urls:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run URL health check
        id: check
        continue-on-error: true
        run: python scripts/validate_urls.py --verbose

      - name: Read report
        if: steps.check.outcome == 'failure'
        id: report
        run: |
          echo "BROKEN_COUNT=$(python -c "import json; r=json.load(open('scripts/url_health_report.json')); print(r['broken_count'])")" >> $GITHUB_OUTPUT

      - name: Create issue for broken URLs
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('scripts/url_health_report.json', 'utf8'));

            let body = `## 🔗 URL Health Check — ${report.generated_at}\n\n`;
            body += `| Metric | Count |\n|---|---|\n`;
            body += `| Scanned | ${report.total_urls_scanned} |\n`;
            body += `| Broken | ${report.broken_count} |\n`;
            body += `| Errors | ${report.errors} |\n\n`;

            if (report.broken_urls.length > 0) {
              body += `### Broken URLs\n\n`;
              for (const u of report.broken_urls) {
                body += `- **${u.file}**: \`${u.url}\` (${u.status_code})\n`;
                if (u.title_context) body += `  - Context: "${u.title_context}"\n`;
                if (u.suggested_replacement) body += `  - 💡 Suggested: ${u.suggested_replacement}\n`;
              }
            }

            body += `\n---\n*Auto-generated by URL Health Check workflow*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 ${report.broken_count} broken URL(s) detected`,
              body: body,
              labels: ['data-quality', 'automated']
            });
