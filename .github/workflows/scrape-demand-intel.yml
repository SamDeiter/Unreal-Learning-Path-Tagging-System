name: Scrape Demand Intelligence

on:
  schedule:
    # Run daily at 6am UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      engine:
        description: 'Engine to scrape (UE5 or UEFN)'
        required: false
        default: 'UE5'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        run: npm install firebase-admin@13

      - name: Run demand intelligence scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/scrape-demand-intel.js --engine ${{ github.event.inputs.engine || 'UE5' }}

      - name: Summary
        if: always()
        run: echo "✅ Demand intelligence scrape completed at $(date -u)"
