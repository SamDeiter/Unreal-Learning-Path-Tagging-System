name: Extract SEO Intelligence

on:
  schedule:
    # Run at 00:00 on day-of-month 1 (Monthly)
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual triggering from the GitHub Actions UI

jobs:
  extract-seo-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the updated JSON file back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
          
      - name: Run DataForSEO Extraction Script
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node scripts/pull_dataforseo.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add path-builder/src/data/seoMetrics.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(data): Automated Monthly DataForSEO MSV/KD Extraction [skip ci]"
          git push
